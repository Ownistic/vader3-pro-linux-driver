[package]
name = "vader3p-steam"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Userspace Bluetooth translator: Flydigi Vader 3 Pro to a Steam-recognizable virtual pad"

[dependencies]
anyhow = "1"
dbus = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
