name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches crate version
        shell: bash
        run: |
          version=$(python3 -c 'import re; print(re.search(r"^version\s*=\s*\x22([^\x22]+)\x22", open("driver/Cargo.toml").read(), re.M).group(1))')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        working-directory: driver
        run: |
          cargo test --locked --all-targets
          cargo build --locked --release --bin vader3p-steam
      - name: Package binary and checksum
        run: |
          cp driver/target/release/vader3p-steam vader3p-steam-linux-x86_64
          sha256sum vader3p-steam-linux-x86_64 > vader3p-steam-linux-x86_64.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes vader3p-steam-linux-x86_64 vader3p-steam-linux-x86_64.sha256
